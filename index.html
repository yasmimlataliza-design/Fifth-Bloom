<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFTH BLOOM</title>


    <!-- Fonte Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">


    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body>


    <header class="header">
        <div class="header-container">


            <a href="index.html" class="logo">
                <img src="assets/ChatGPT Image 9 de mai. de 2026, 11_34_20-Photoroom 1.png" alt="Logo Fifth Bloom">
            </a>


            <!-- Menu de navegação -->
            <nav class="main-nav" id="main-nav">
                <a href="index.html" class="nav-link active">Início</a>
                <a href="produtos.html" class="nav-link">Produtos</a>
                <a href="lancamentos.html" class="nav-link">Lançamentos</a>
                <a href="sobre.html" class="nav-link">Sobre Nós</a>
                <a href="favoritos.html" class="nav-link">Favoritos</a>
            </nav>


            <!-- Ações do cabeçalho -->
            <div class="header-actions">


                <!-- Pesquisa -->
                <form class="search-box" id="search-form">
                    <input
                        type="search"
                        id="campo-busca"
                        placeholder="Buscar produtos..."
                        aria-label="Buscar produtos"
                    >


                    <button type="submit" aria-label="Pesquisar">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="10.5" cy="10.5" r="7.5"></circle>
                            <line x1="16" y1="16" x2="22" y2="22"></line>
                        </svg>
                    </button>
                </form>


                <!-- SACOLA: coloque a imagem em assets/sacola.png -->
                <a href="sacola.html" class="icon-link sacola-link"
                   aria-label="Sacola de compras">


                    <img
                        src="./assets/Ícone Minimalista de Sacola de Compras.png"
                        alt=""
                        class="header-icon"
                    >


                    <span class="contador-sacola" id="contador-sacola">0</span>
                </a>


                <!-- PERFIL: coloque a imagem em assets/perfil_fundo_transparente.png -->
                <a href="perfil.html" class="profile-link">


                    <img
                        src="./assets/Ícone de perfil minimalista azul-acinzentado.png"
                        alt=""
                        class="header-icon profile-icon"
                    >


                    <span>PERFIL</span>
                </a>


            </div>


            <button class="hamburguer" id="btn-menu">☰</button>
               


        </div>
    </header>


    <!-- Arquivo JavaScript -->
    <script src="script.js"></script>


</body>
</html>
